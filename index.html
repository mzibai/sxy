<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>简单密码</title>
</head>
<body>
    <!-- 密码输入框 -->
    <input id="pwdInput" type="password" placeholder="请输入秘钥">
    <button onclick="checkPwd()">确认秘钥</button>

    <!-- 初始隐藏的按钮 -->
    <button id="secretBtn" style="display:none;" onclick="showCode()">获得咕咕密码</button>

    <!-- 显示结果 -->
    <p id="result"></p>

    <script>
        function checkPwd() {
            var pwd = document.getElementById('pwdInput').value;
            if (pwd === '天上的欣欣不说话') {
                document.getElementById('secretBtn').style.display = 'inline-block';
                document.getElementById('result').innerText = '秘钥正确！';
            } else {
                document.getElementById('result').innerText = '秘钥错误';
            }
        }

        function showCode() {
            document.getElementById('result').innerText = '目前还未收录密码';
        }
    </script>
</body>
</html>
